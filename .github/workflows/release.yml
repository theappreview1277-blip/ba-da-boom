name: Release

# Pushing a version tag (v0.1.1, say), or running this workflow by hand on main,
# builds the Windows installer and publishes it, with the latest.yml the app's update
# check reads, as the GitHub release v<version in package.json>. Installed copies of
# the app then offer the update. Starting it is the decision to release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag matches the version in package.json (or a hand-started run is on main)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          else test "$GITHUB_REF_NAME" = main; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run kits
      # electron-builder only builds; the release is made here in one step, because its own
      # publisher uploaded the files in parallel and raced itself creating the release.
      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish the installer and latest.yml as the release v<version>
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p 'require("./package.json").version')"
          FILES=(release/Ba-da-boom-Setup-$V-x64-unsigned.exe release/Ba-da-boom-Setup-$V-x64-unsigned.exe.blockmap release/latest.yml)
          ls -l "${FILES[@]}"
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" "${FILES[@]}" --clobber
          else
            gh release create "v$V" "${FILES[@]}" --target "$GITHUB_SHA" --title "Ba-da-boom $V" --notes "Windows installer (x64, not code-signed yet, so Windows SmartScreen may warn). Installed copies of Ba-da-boom offer this update by themselves."
          fi
          gh release view "v$V" --json assets --jq '.assets[].name'
