name: Release

# Pushing a version tag (v0.1.1, say), or running this workflow by hand on main,
# builds the Windows installer and publishes it, with the latest.yml the app's update
# check reads, as the GitHub release v<version in package.json>. Installed copies of
# the app then offer the update. Starting it is the decision to release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag matches the version in package.json (or a hand-started run is on main)
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          else test "$GITHUB_REF_NAME" = main; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run kits
      - name: Build the installer and publish it as a release
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
