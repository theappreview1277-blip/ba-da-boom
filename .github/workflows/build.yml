name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build unsigned installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Ba-da-boom-unsigned-installer
          path: release/*.exe
          if-no-files-found: error

  # Every end-to-end test against the real app (Electron), on a virtual screen.
  # Real Windows audio is still checked on the laptop with scripts\windows-test.cmd.
  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run every test against the app
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node test/e2e/run-all.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
