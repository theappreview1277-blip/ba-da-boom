name: Plugin

# The VST3 and CLAP plugin: built, checked by pluginval (strictness 10) and clap-validator,
# its engine's own tests, and the end-to-end suite that compares it with the app and opens
# its screen in a host. Windows is what ships; Linux runs the same checks as the cloud does.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: WebView2 SDK (for the plugin's screen)
        shell: bash
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory "$RUNNER_TEMP/nuget"
      - name: Configure
        shell: bash
        run: cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$RUNNER_TEMP/nuget"
      - name: Build
        run: cmake --build plugin/build --config Release --parallel --target Badaboom_VST3 Badaboom_CLAP bdb_core_tests bdb_render bdb_host_test
      - name: Engine tests
        run: plugin\build\Release\bdb_core_tests.exe
      - name: pluginval, strictness 10
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 300000 --output-dir pluginval-logs "plugin/build/Badaboom_artefacts/Release/VST3/Ba-da-boom.vst3"
      - name: clap-validator
        shell: bash
        run: |
          curl -sSL -o cv.zip https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-windows.zip
          7z x -y cv.zip > /dev/null
          "$(find . -name clap-validator.exe | head -1)" validate "plugin/build/Badaboom_artefacts/Release/CLAP/Ba-da-boom.clap"
      - name: Download Electron
        shell: bash
        run: |
          for i in 1 2 3 4; do node node_modules/electron/install.js && node -e "require('electron')" && exit 0; sleep $((i * 15)); done
          exit 1
      - name: The plugin against the app, in a host, with its screen
        run: node test/e2e/plugin.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ba-da-boom-plugin-windows
          path: |
            plugin/build/Badaboom_artefacts/Release/VST3/
            plugin/build/Badaboom_artefacts/Release/CLAP/
            plugin/build/Release/bdb_render.exe
            plugin/build/bdb_host_test_artefacts/Release/bdb_host_test.exe
            pluginval-logs/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfontconfig1-dev libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev xvfb
      - run: npm ci
      - run: npm run build
      - run: cmake -S plugin -B plugin/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build plugin/build --parallel
      - run: plugin/build/bdb_core_tests
      - name: pluginval, strictness 10
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -o -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --timeout-ms 300000 plugin/build/Badaboom_artefacts/Release/VST3/Ba-da-boom.vst3
      - name: clap-validator
        run: |
          curl -sSL -o cv.tar.gz https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz
          tar xzf cv.tar.gz
          xvfb-run -a "$(find . -name clap-validator -type f | head -1)" validate plugin/build/Badaboom_artefacts/Release/CLAP/Ba-da-boom.clap
      - name: Download Electron
        run: |
          for i in 1 2 3 4; do node node_modules/electron/install.js && node -e "require('electron')" && exit 0; sleep $((i * 15)); done
          exit 1
      - name: The plugin against the app, in a host, with its screen
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node test/e2e/plugin.mjs
